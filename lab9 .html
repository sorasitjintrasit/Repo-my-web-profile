
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>โปรไฟล์ของฉัน</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>โปรไฟล์ของฉัน (My Profile)</h1>
  </header>

  <main>
    <section class="card">

      <img src="gender_3066802 (1).png" alt="รูปโปรไฟล์ตัวอย่าง">

      <span class="badge">my-web-profile</span>

      <h2 id="profile-name">สมชาย ใจดี</h2>

      <p class="bio">
        นักพัฒนาเว็บไซต์ที่ชื่นชอบการเรียนรู้สิ่งใหม่ๆ และรักการดื่มกาแฟ
      </p>

      <h3>ทักษะของฉัน</h3>

      <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
      </ul>

      <div class="tags">
        <span class="tag">HTML / CSS</span>
        <span class="tag">Git & GitHub</span>
        <span class="tag">Web Profile</span>
      </div>

    </section>
  </main>

</body>
</html>
